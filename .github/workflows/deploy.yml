name: Encrypt and Deploy

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Encrypt with StatiCrypt
        env:
          STATICRYPT_PASSWORD: ${{ secrets.STATICRYPT_PASSWORD }}
        run: |
          npm install -g staticrypt@latest
          mkdir -p dist

          # Encrypt index.html into the dist/ directory
          npx staticrypt index.html --password "$STATICRYPT_PASSWORD" --output dist/index.html --template-title "IISER Kolkata Campus Radio — Portal Login" --remember 30

          # Verify that dist/index.html was actually generated and has real size
          if [ ! -s dist/index.html ]; then
            echo "Error: dist/index.html was not generated properly!"
            exit 1
          fi

          echo "File encrypted successfully. Size check:"
          ls -lh dist/

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
