name: Encrypt and Deploy

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Encrypt with StatiCrypt
        env:
          STATICRYPT_PASSWORD: ${{ secrets.STATICRYPT_PASSWORD }}
        run: |
          mkdir -p dist
          PASS="${STATICRYPT_PASSWORD:-CampusRadio2026}"
          
          # 1. Encrypt only index.html (the admin creation portal)
          npx staticrypt index.html -p "$PASS" -d dist/

          # 2. Copy the public verification page and assets
          cp verify.html dist/
          [ -f logo.png ] && cp logo.png dist/
          [ -f sidebar.png ] && cp sidebar.png dist/

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
